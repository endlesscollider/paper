name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .vitepress/cache
          key: vitepress-${{ hashFiles('**/*.md', '.vitepress/config.mts', 'package-lock.json') }}
          restore-keys: vitepress-
      - run: npm run docs:build
        env:
          # ubuntu-latest 只有约 7GB 可用内存：heap 上限若高于物理内存，
          # V8 会推迟 GC 直到进程被 OOM-Kill（表现为 18 分钟后 cancelled）。
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
