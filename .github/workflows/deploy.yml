name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add swap
        # runner 只有约 7GB 内存，主渲染堆上限设为 8192MB，
        # 超出物理内存的部分由 swap 兜底，避免被 OOM-Kill。
        # 不同 runner 镜像的 fallocate 支持不一样，逐级回退到 dd。
        continue-on-error: true
        run: |
          set -x
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile \
            || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - uses: actions/cache@v4
        with:
          path: .vitepress/cache
          key: vitepress-${{ hashFiles('**/*.md', '.vitepress/config.mts', 'package-lock.json') }}
          restore-keys: vitepress-
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
